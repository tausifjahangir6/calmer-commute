services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: calmer-commute-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
    env_file:
      - backend/.env
    environment:
      FLASK_DEBUG: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app/ai/models:/app/ai/features"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:    
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env.local  
    container_name: calmer-commute-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:5000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
